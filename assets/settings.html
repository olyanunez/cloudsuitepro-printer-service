<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - CloudSuite Printer Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        select,
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            margin-right: 10px;
        }

        .btn-primary {
            background: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background: #45a049;
        }

        .btn-secondary {
            background: #f1f1f1;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .status {
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .info {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #0c5460;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>⚙️ Configuración</h1>

        <div class="info">
            <strong>Puerto:</strong> 9100<br>
            <strong>Estado:</strong> <span id="status">Activo</span>
        </div>

        <div class="form-group">
            <label for="printerSelect">Impresora</label>
            <select id="printerSelect">
                <option value="">Cargando...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="printerType">Tipo de Impresora</label>
            <select id="printerType">
                <option value="EPSON">Epson (ESC/POS)</option>
                <option value="STAR">Star</option>
                <option value="TANCA">Tanca</option>
            </select>
        </div>

        <div class="form-group">
            <label for="width">Ancho (caracteres)</label>
            <input type="number" id="width" value="48" min="32" max="80">
        </div>

        <div>
            <button class="btn btn-primary" onclick="saveConfig()">Guardar</button>
            <button class="btn btn-secondary" onclick="testPrint()">Imprimir Prueba</button>
        </div>

        <div id="statusMessage" class="status"></div>
    </div>

    <script>
        // Cargar configuración y lista de impresoras
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await loadPrinters();
                await loadConfig();
            } catch (error) {
                console.error('Error al inicializar:', error);
                showStatus('Error al inicializar: ' + error.message, 'error');
            }
        });

        async function loadPrinters() {
            try {
                const response = await fetch('http://localhost:9100/printers');
                const data = await response.json();

                const select = document.getElementById('printerSelect');
                select.innerHTML = '<option value="">Seleccione una impresora</option>';

                if (data.printers && data.printers.length > 0) {
                    data.printers.forEach(printer => {
                        const option = document.createElement('option');
                        option.value = printer;
                        option.textContent = printer;
                        select.appendChild(option);
                    });
                } else {
                    select.innerHTML = '<option value="">No se encontraron impresoras</option>';
                }
            } catch (error) {
                console.error('Error cargando impresoras:', error);
                showStatus('Error cargando impresoras', 'error');
            }
        }

        async function loadConfig() {
            try {
                const response = await fetch('http://localhost:9100/config');
                const data = await response.json();

                if (data.success) {
                    const config = data.config;
                    document.getElementById('printerSelect').value = config.printerName || '';
                    document.getElementById('printerType').value = config.printerType || 'EPSON';
                    document.getElementById('width').value = config.width || 48;
                }
            } catch (error) {
                console.error('Error cargando configuración:', error);
            }
        }

        async function saveConfig() {
            const config = {
                printerName: document.getElementById('printerSelect').value || null,
                printerType: document.getElementById('printerType').value,
                width: parseInt(document.getElementById('width').value),
                interface: 'printer'
            };

            try {
                const response = await fetch('http://localhost:9100/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });

                const data = await response.json();

                if (data.success) {
                    showStatus('✓ Configuración guardada correctamente', 'success');
                } else {
                    showStatus('Error: ' + data.error, 'error');
                }
            } catch (error) {
                console.error('Error guardando configuración:', error);
                showStatus('Error al guardar configuración', 'error');
            }
        }

        async function testPrint() {
            try {
                const response = await fetch('http://localhost:9100/test', {
                    method: 'POST'
                });

                const data = await response.json();

                if (data.success) {
                    showStatus('✓ Test de impresión enviado', 'success');
                } else {
                    showStatus('Error: ' + data.error, 'error');
                }
            } catch (error) {
                console.error('Error en test:', error);
                showStatus('Error al imprimir test', 'error');
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;

            setTimeout(() => {
                statusDiv.className = 'status';
            }, 5000);
        }
    </script>
</body>

</html>
